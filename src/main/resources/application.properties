spring.application.name=springboot-user-mgmt
#http://localhost:8081/swagger-ui/index.html
# Configuration for MySQL Database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url = jdbc:mysql://localhost:3306/mustafeez
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql:true

# disable autoconfiguration and enable manual port configuration
server.port=8081
#property for actuator to show all endpoints http://localhost:8081/actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#spring security
spring.security.user.name=user
spring.security.user.password=pass